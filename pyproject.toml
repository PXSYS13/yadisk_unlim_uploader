[project]
name = "yadisk-unlim-uploader"
version = "1.0.0"
description = "Загрузка фото и видео из папки на компьютере в безлимитное хранилище Яндекс.Диска (/photounlim)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "python-dotenv>=1.2.3",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "uvicorn>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "httpx2>=2.0.0; python_version >= '3.11'",
    "httpx>=0.27.0; python_version < '3.11'",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "error::EncodingWarning",
    "error::DeprecationWarning:uploader",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
