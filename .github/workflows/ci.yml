name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          # та же версия, что закреплена в webui.bat и webui.sh
          version: "0.13.4"
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Verify uv.lock
        run: uv lock --check

      - name: Lint with ruff
        run: uv run --locked --python ${{ matrix.python-version }} ruff check .

      - name: Format check with ruff
        run: uv run --locked --python ${{ matrix.python-version }} ruff format --check .

      - name: JS syntax check
        run: node --check webui_assets/static/app.js

      - name: ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck webui.sh webui.command

      - name: Tests with coverage (>= 80%)
        run: >-
          uv run --locked --python ${{ matrix.python-version }} pytest -v
          --cov=uploader --cov=upload_unlim --cov=webui
          --cov-report=term-missing:skip-covered --cov-fail-under=80
        env:
          PYTHONWARNDEFAULTENCODING: "1"

      - name: Smoke CLI without dev dependencies
        run: uv run --locked --no-dev --python ${{ matrix.python-version }} upload_unlim.py --help

      - name: Smoke Web UI import without dev dependencies
        run: uv run --locked --no-dev --python ${{ matrix.python-version }} python -c "import webui; assert webui.app"
